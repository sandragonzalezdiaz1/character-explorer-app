<a class="character-card" [routerLink]="['/character', character.id]">
  <img [src]="character.image" [alt]="character.name" (error)="handleImageError($event)">
  <div class="character-card-content">
    <h2>{{ character.name }}</h2>
    <p>
      <strong>Estado:</strong> {{ character.status | statusTranslate }}
    </p>
    <p>
      <strong>Especie:</strong> {{ character.species }}
    </p>
    <span class="detail-link">Ver detalle →</span>
  </div>
</a>
