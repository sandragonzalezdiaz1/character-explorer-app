<label for="status" i18n="@@statusFilter.label">Selecciona un estado:</label>
<select name="status" id="status" [value]="status" (change)="handleStatusChange($event)">
  <option value="" i18n="@@statusFilter.all">Todos los estados</option>
  <option value="Alive" i18n="@@statusFilter.alive">Vivo</option>
  <option value="Dead" i18n="@@statusFilter.dead">Muerto</option>
  <option value="unknown" i18n="@@statusFilter.unknown">Desconocido</option>
</select>
